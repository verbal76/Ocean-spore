name: APK Build (GitHub-hosted)

# GitHub-hosted Gradle build per HANDOFF.md. Uses Actions' free runner
# minutes - no EAS Build credits or EAS_TOKEN required. Produces a
# standalone release-mode APK (JS bundled in, no Metro dev server
# needed) and publishes it to a GitHub Release tagged build-N that
# the operator can sideload on a phone.
#
# Expo's prebuild template defaults release.signingConfig to
# signingConfigs.debug, so the auto-included debug.keystore is used
# to sign the release APK. No keystore secrets are required.

on:
  workflow_dispatch:
  push:
    branches:
      - working-branch-ocean-spore
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/android-build.yml'
      - 'plugins/**'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate build info
        run: node scripts/write-build-info.mjs

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'
          # Force the OTA channel into the prebuild output. expo-updates'
          # config plugin reads `updates.channel` from app.json AND/OR
          # this env var when generating AndroidManifest.xml. On EAS
          # Build the env var is injected automatically; on a manual
          # GitHub-hosted gradle build it isn't, so the channel can
          # end up missing from the manifest - which is exactly the
          # 'CHANNEL: (blank)' / OTAs-don't-land symptom we saw on
          # builds #19 - #28. Forcing it here makes the manifest
          # explicit and the device knows which Expo branch to ask.
          EXPO_UPDATES_CHANNEL: 'preview'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # assembleRelease bundles the JS into the APK and signs it with
      # the auto-included debug.keystore (per Expo prebuild's default
      # release.signingConfig). This is the standalone-sideload path -
      # no Metro dev server needed at runtime.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=ocean-spore-build-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK for upload
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 'Ocean Spore APK build #${{ github.run_number }}'
          body: |
            Auto-built from commit `${{ github.sha }}`.

            Standalone release-mode APK (JS bundled in, no Metro
            dev server needed). Signed with the auto-generated debug
            keystore so it sideloads without any signing setup.

            Install via:
            1. Download the APK below.
            2. On your Android device, allow "install from unknown sources" for your browser / file manager.
            3. Open the downloaded APK to install.
          files: ${{ steps.apk.outputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
