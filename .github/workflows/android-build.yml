name: APK Build (GitHub-hosted)

# GitHub-hosted Gradle build per HANDOFF.md. Uses Actions' free runner
# minutes - no EAS Build credits or EAS_TOKEN required. Produces a
# debug-signed APK and publishes it to a GitHub Release tagged build-N
# that the operator can sideload on a phone.

on:
  workflow_dispatch:
  push:
    branches:
      - working-branch-ocean-spore
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/**'
      - 'ios/**'
      - 'assets/icon.png'
      - 'assets/adaptive-icon.png'
      - 'assets/splash-icon.png'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=ocean-spore-build-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK for upload
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      # NOTE: actions/upload-artifact was removed - the user's GitHub
      # Actions artifact storage quota was hit and uploads fail. The
      # GitHub Release below is the primary delivery path and uses repo
      # storage (separate, much larger quota).

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 'Ocean Spore APK build #${{ github.run_number }}'
          body: |
            Auto-built from commit `${{ github.sha }}`.

            Sideload-only debug-signed APK. Install via:
            1. Download the APK below.
            2. On your Android device, allow "install from unknown sources" for your browser / file manager.
            3. Open the downloaded APK to install.
          files: ${{ steps.apk.outputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
