name: APK Build (GitHub-hosted)

# The one manually triggered coordinated build (studio standard v2.0, sec. 9).
# It builds the selected platform(s) from ONE exact, approved source SHA and
# names the output
#   Ocean Spore Build NN APK.apk      (+ build-manifest.json, checksums.sha256)
# and, only when destination = github_releases, publishes ONE GitHub Release
# "Ocean Spore Build NN" (immutable tag build-NN).
#
# ACTIONS BUDGET POLICY (see CLAUDE.md): DELIBERATE-ONLY. Never runs on pushes or
# ordinary PR updates. Validate locally first (`npm run verify`). Start it with
#   Actions -> APK Build -> Run workflow (platform, source_sha, build_number,
#   destination), or
#   add the `publish-apk` label to the pull request (builds the PR head commit,
#   publishes to GitHub Releases; clear and re-add it to rebuild). The label route
#   exists because the agent integration token cannot dispatch workflows.
# Only `android` exists as a target today: windows / linux / all fail immediately
# and visibly (docs/PLATFORM_SUPPORT.md); nothing is silently skipped.
#
# Signing: the Expo prebuild template signs release builds with its bundled
# debug keystore. Fine for sideloading, NOT for distribution or Google Play
# (owner decision; see docs/SIGNING.md).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        type: choice
        options: [android, windows, linux, all]
        default: android
      source_sha:
        description: 'Exact approved commit (full 40-character SHA)'
        type: string
        required: true
      build_number:
        description: 'Coordinated build number (must equal oceanSpore.build in package.json at that SHA)'
        type: string
        required: true
      destination:
        description: 'Where the result goes'
        type: choice
        options: [local_only, github_releases]
        default: local_only
  pull_request:
    # Only the `publish-apk` label starts a build. Opening or pushing to a PR
    # does not (the job conditions below skip everything else immediately).
    types: [labeled]

permissions:
  contents: read

# Let an in-progress APK build finish; a newer request waits as the single
# pending run. Cancelling a 10-minute Gradle build throws away the only signal we
# have.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap (seconds): decide exactly what is being asked for, or fail visibly.
  plan:
    name: Plan the build
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'publish-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      destination: ${{ steps.p.outputs.destination }}
      build_number: ${{ steps.p.outputs.build_number }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_SHA: ${{ inputs.source_sha }}
          IN_BUILD: ${{ inputs.build_number }}
          IN_DEST: ${{ inputs.destination }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_PLATFORM" != "android" ]; then
              echo "::error::Platform '$IN_PLATFORM' is not supported: only android exists in this repository (docs/PLATFORM_SUPPORT.md). Nothing was built."
              exit 1
            fi
            [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-character lowercase SHA"; exit 1; }
            [[ "$IN_BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build_number must be a positive integer"; exit 1; }
            SHA="$IN_SHA"; DEST="$IN_DEST"; BUILD="$IN_BUILD"
          else
            SHA="$PR_SHA"; DEST="github_releases"; BUILD=""
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Plan: android @ $SHA -> $DEST (build ${BUILD:-from package.json})"

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  build:
    name: Build Android APK
    needs: [plan, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
      version-name: ${{ steps.apk.outputs.version }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      # Build exactly the approved commit (not a synthetic PR merge commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Releases are immutable and one build number = one source: refuse a number
      # that already has a tag / GitHub Release, and a requested build_number that
      # is not the one committed at this SHA (checked before any expensive step).
      - name: Build number valid and unused
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUILD: ${{ needs.plan.outputs.build_number }}
        run: |
          V=$(node scripts/version.js version-name)
          if [ -n "$REQUESTED_BUILD" ] && [ "$REQUESTED_BUILD" != "$V" ]; then
            echo "::error::build_number $REQUESTED_BUILD != oceanSpore.build $V committed at this SHA"; exit 1
          fi
          python3 scripts/check-version-unused.py "$V"
          T=$(node scripts/version.js release-tag)
          for tag in "$T" "v$V"; do
            if gh api "repos/${{ github.repository }}/releases/tags/$tag" > /dev/null 2>&1; then
              echo "::error::A GitHub Release $tag already exists. Bump oceanSpore.build."; exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships an Android SDK. android-actions/setup-android@v3
      # now fails ("Failed to find package 'tools'": the legacy package is gone
      # from Google's repository), so just accept licenses and let Gradle
      # fetch what it needs.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The approved source is the exact commit this run was asked to build (the
      # PR head at label time, or the dispatched commit). Fail early unless the
      # checkout IS that commit and it belongs to the authorized development line.
      # (Unrelated branch activity is reported by audit-branches.py, never gating.)
      - name: Verify approved source SHA
        env:
          APPROVED_SHA: ${{ needs.plan.outputs.sha }}
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/check-source-line.py --release

      - name: Generate build info and provenance
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/write-build-info.mjs

      - name: Generate android/ project (expo prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Name and verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          [ -n "$SRC" ] || { echo "::error::No APK produced"; exit 1; }
          NAME=$(node scripts/version.js apk-name)
          VERSION=$(node scripts/version.js version-name)
          CODE=$(node scripts/version.js version-code)
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/$NAME"

          # The APK itself must carry the identity we are about to publish.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          BADGING=$("$AAPT" dump badging "dist-apk/$NAME")
          echo "$BADGING" | grep -q "package: name='com.verbal76.oceanspore'" \
            || { echo "::error::Unexpected package id"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$CODE'" \
            || { echo "::error::versionCode in APK != $CODE"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION'" \
            || { echo "::error::versionName in APK != $VERSION"; exit 1; }

          SHA=$(sha256sum "dist-apk/$NAME" | cut -d' ' -f1)
          echo "APK: $NAME  versionName=$VERSION versionCode=$CODE"
          echo "SHA-256: $SHA  ($NAME)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### $NAME"
            echo "- versionName: \`$VERSION\`  versionCode: \`$CODE\`"
            echo "- source: \`$(git rev-parse HEAD)\`"
            echo "- SHA-256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Release qualification of the BUILT, merged manifest: package, versions,
      # target SDK 36, a strict permission allowlist (no microphone / foreground
      # service from native modules), portrait, non-debuggable, and the
      # historical signing certificate (upgrade compatibility with build-39).
      - name: Manifest qualification
        run: python3 scripts/check-manifest.py "dist-apk/${{ steps.apk.outputs.name }}"

      # Blocking since the Expo SDK 54 / RN 0.81 / NDK 27 upgrade: the 64-bit
      # ABIs are 13/13 16 KB-ready (the SDK 52 build failed 13 of 14 libs).
      # Google Play requires 16 KB support for new submissions.
      - name: 16 KB page-size qualification
        env:
          ENFORCE_16KB: 'true'
        run: |
          set +e
          python3 scripts/check-16kb.py "dist-apk/${{ steps.apk.outputs.name }}" | tee 16kb.txt
          STATUS=${PIPESTATUS[0]}
          { echo '### 16 KB page-size check'; echo '```'; tail -n 40 16kb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ] && [ "$ENFORCE_16KB" = "true" ]; then exit 1; fi
          if [ "$STATUS" -ne 0 ]; then echo "::warning::APK is not 16 KB page-size compatible (not enforced yet)"; fi

      # One source SHA -> every platform artifact. Fails if the tree built is
      # not exactly the approved commit, or the APK does not embed that SHA.
      - name: Build manifest and checksums
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/release-manifest.mjs "dist-apk/${{ steps.apk.outputs.name }}" dist-apk/build-manifest.json dist-apk/checksums.sha256

      - name: Manifest and checksums match the packaged files
        env:
          APPROVED_SHA: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/check-source-line.py --verify-manifest dist-apk/build-manifest.json --files-dir dist-apk

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist-apk/${{ steps.apk.outputs.name }}
            dist-apk/build-manifest.json
            dist-apk/checksums.sha256
          # Only handed to the release job (the Release is the durable copy).
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.destination == 'github_releases'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: build-files
          path: release-files

      # The release files and metadata must identify the same approved SHA.
      - name: Release files match the approved SHA
        env:
          APPROVED_SHA: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/check-source-line.py --verify-manifest release-files/build-manifest.json --files-dir release-files

      - name: Release title and tag
        id: rel
        run: |
          echo "title=$(node scripts/version.js release-title)" >> "$GITHUB_OUTPUT"
          echo "tag=$(node scripts/version.js release-tag)" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          # Playtest metadata only; the visible title carries no classification.
          prerelease: true
          name: ${{ steps.rel.outputs.title }}
          files: |
            release-files/${{ needs.build.outputs.apk-name }}
            release-files/build-manifest.json
            release-files/checksums.sha256
          fail_on_unmatched_files: true
          body: |
            ${{ needs.build.outputs.apk-name }}

            Source: `${{ needs.plan.outputs.sha }}`
            SHA-256: `${{ needs.build.outputs.sha256 }}`

            Playtest build: standalone release-mode APK for sideloading (signed with
            the Expo debug keystore, not a Play upload key). Not an OTA; nothing is
            pushed to installed apps. See build-manifest.json and checksums.sha256.
          token: ${{ secrets.GITHUB_TOKEN }}
