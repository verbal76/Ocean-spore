name: EAS Update (OTA)

# MANUAL ONLY. An OTA reaches every installed build on the same runtimeVersion
# immediately, so it must never fire because someone pushed code.
#
# Safety rails:
#   * workflow_dispatch only (no push trigger)
#   * typecheck + tests + bundle export must pass first (ci.yml)
#   * you must retype the current runtimeVersion from app.json; a mismatch
#     aborts, so an update can't be sent across a native/runtime boundary
#   * the Expo token is only exposed to the publish step
#   * inputs go through env vars, never interpolated into shell

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update branch/channel'
        type: choice
        options: [preview, production]
        default: preview
      runtime_version:
        description: 'Confirm app.json runtimeVersion this update targets'
        required: true
      message:
        description: 'Update message'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  update:
    name: Publish OTA update
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm runtime version
        env:
          CONFIRM: ${{ inputs.runtime_version }}
        run: |
          ACTUAL=$(node -p "require('./app.json').expo.runtimeVersion")
          if [ "$CONFIRM" != "$ACTUAL" ]; then
            echo "::error::runtimeVersion is '$ACTUAL' but you confirmed '$CONFIRM'. Aborting."
            exit 1
          fi
          echo "Publishing for runtimeVersion $ACTUAL"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest

      - name: Generate build info
        run: node scripts/write-build-info.mjs

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.OCEAN }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::OCEAN secret is empty or missing"; exit 1; }
          MSG="$UPDATE_MESSAGE"
          [ -n "$MSG" ] || MSG="$(git log -1 --pretty=%s)"
          eas update --non-interactive --branch "$UPDATE_BRANCH" --message "$MSG"
