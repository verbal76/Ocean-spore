name: EAS Update (OTA)

on:
  push:
    branches:
      - 'working-branch-ocean-spore'
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update channel/branch (preview | production)'
        required: true
        default: 'preview'
      message:
        description: 'Update message'
        required: false
        default: ''

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail loud and early with a clear diagnosis if the EAS_TOKEN
      # repo secret isn't set. Avoids the misleading 1m20s journey
      # that ends in 'An Expo user account is required'.
      - name: Verify EAS_TOKEN secret present
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_TOKEN repo secret is empty or missing."
            echo "::error::Add it at: https://github.com/verbal76/Ocean-spore/settings/secrets/actions"
            echo "::error::Name must be exactly EAS_TOKEN (case-sensitive). Value: a token from the EAS dashboard."
            exit 1
          fi
          echo "EAS_TOKEN secret resolved (length: ${#EXPO_TOKEN} chars)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate build info
        run: node scripts/write-build-info.mjs

      - name: Prepare assets
        run: npm run prepare-assets

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          BRANCH="${{ github.event.inputs.branch || 'preview' }}"
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="$(git log -1 --pretty=%B | head -n1)"
          fi
          eas update --non-interactive --branch "$BRANCH" --message "$MSG"
