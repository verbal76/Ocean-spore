name: CI

# Fast checks that must pass before anything is built or published.
# Reusable: android-build.yml and eas-update.yml call it with `uses:`.
# Deliberately NOT triggered by push / pull_request (Actions budget policy,
# see CLAUDE.md): the same commands run locally via `npm run verify`.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Pillow (brand check)
        run: python3 -m pip install --quiet pillow

      - name: Hot Attic Games logo integrity
        run: python3 scripts/check-brand.py

      - name: Audio assets match their generator
        run: python3 scripts/check-audio.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundled asset integrity (matches the original APK)
        run: node scripts/check-assets.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Version identity
        run: |
          node scripts/version.js apk-name
          node scripts/version.js version-code

      - name: Export Android JS bundle (validates every import and asset)
        run: node scripts/write-build-info.mjs && npx expo export --platform android --output-dir dist-ci
        env:
          EXPO_NO_TELEMETRY: '1'
